name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.40.8
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: neuroride_app
        run: flutter pub get

      - name: Build debug APK
        working-directory: neuroride_app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuroride-debug-apk
          path: neuroride_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build release APK (unsigned)
        working-directory: neuroride_app
        run: flutter build apk --release

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuroride-release-apk
          path: neuroride_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
